<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MAHJONG ROYALE</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app">
<header><button id="menu" class="rb" aria-label="Menu">☰</button>
<div class="ttl"><h1>MAHJONG ROYALE</h1><span id="ways">15.625 WAYS</span></div><i class="rb sp"></i></header>
<div id="ladder"><i>×1</i><i>×2</i><i>×3</i><i>×5</i><i>×10</i></div>
<main id="board"><div id="cols"></div><div id="fx"></div><div id="banner"></div></main>
<div id="marq">Cascade menaikkan multiplier hingga ×10</div>
<section id="info"><div>SALDO<b id="bal">0</b></div><div>BET<b id="bet">0</b></div><div>WIN<b id="win">0</b></div></section>
<footer><button id="turbo" class="tb">⚡<small>TURBO</small></button><button id="dn" class="rb">−</button>
<button id="spin" aria-label="Spin">⟳</button><button id="up" class="rb">+</button>
<button id="auto" class="tb">▶<small>AUTO</small></button></footer>
</div>
<dialog id="dlg"><div id="pt"></div><div class="dr"><button id="reset">Reset saldo</button><button id="close">Tutup</button></div></dialog>
<script src="script.js"></script></body></html>
